services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      DB_PATH: /data/haunted-escape.sqlite
    volumes:
      - haunted-escape-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  haunted-escape-data:
